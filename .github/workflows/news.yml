name: Update news headlines

on:
  schedule:
    - cron: '23 */4 * * *'    # every 4 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-headlines
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Build
        run: python build_news.py
      - name: Commit changes
        run: |
          git config user.name "tuno-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A news
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "News update $(date -u +%F\ %H:%M)"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break; sleep 5; done
