name: Update radio catalog

on:
  schedule:
    - cron: '17 3 * * *'      # every day: the countries the Radio apps ship
    - cron: '47 4 * * 0'      # every Sunday: all other countries too
  workflow_dispatch:
    inputs:
      countries:
        description: 'ISO codes separated by spaces (empty = the Radio apps countries)'
        required: false

permissions:
  contents: write

concurrency:
  group: radio-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Pick countries
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.countries }}" ]; then
            echo "list=${{ github.event.inputs.countries }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "47 4 * * 0" ]; then
            echo "list=" >> "$GITHUB_OUTPUT"
          else
            echo "list=HR SI BG RS RO MK NL GR ME BA TR HU" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: python build_radio.py ${{ steps.pick.outputs.list }}
      - name: Commit changes
        run: |
          git config user.name "tuno-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A radio state
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Radio catalog update $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
